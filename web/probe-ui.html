<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0}</style></head>
<body>
<script type="module">
  import { ProcPalette } from "/js/view/palette.js";
  import { loadMeta } from "/js/saveStore.js";
  import * as N from "/js/ui/next/screens.js";
  import { TECH_TREES } from "/js/data/techTree.js";

  const W = window;

  function mkApp() {
    const ui = document.createElement("div");
    ui.setAttribute("id", "ui");
    document.body.appendChild(ui);
    const app = {
      ui,
      meta: loadMeta(),
      screen: "",
      status: "",
      forgeSlot: 0,
      forgeReturn: "",
      prepLevelId: 1,
      prepSlot: 0,
      upgradeReturn: "",
      techTreeTab: "foundations",
      techSelectedId: null,
      palette: new ProcPalette(),
      synth: { play() {}, resume() {}, setVolume() {}, setMusicVolume() {} },
      score: {
        stop() {},
        setEnabled() {},
        setMusicVolume() {},
        tick() {},
        start() {},
        setDensity() {},
        setPhase() {},
      },
      bindUi() {},
      toast() {},
      persistMeta() {},
      applyPitch() {},
    };
    app.paintForgePreview = () => forge.paintForgePreview(app);
    return app;
  }

  const NEXT = {
    main: (s) => N.renderMain(s),
    hub: (s) => N.renderHub(s),
    victory: (s) => N.renderVictory(s),
    gameover: (s) => N.renderGameOver(s),
    campaign: (s) => N.renderCampaign(s),
    forge: (s) => N.renderForge(s),
    tech: (s) => N.renderTech(s),
    settings: (s) => N.renderSettings(s),
  };

  function campaignSim(endless) {
    return {
      modeEndless: endless,
      campaignLevelId: 3,
      waveIndex: 5,
      lives: 0,
      leakCount: 7,
      killCount: 41,
      runSeed: 42,
      economy: { runWaveGains: { coin: 60, parts: 9, aether: 4 } },
    };
  }

  W.__renderScreen = (name, opts = {}) => {
    const app = mkApp();
    app.__opts = opts;
    if (name === "victory" || name === "gameover") {
      app.sim = opts.endless ? campaignSim(true) : campaignSim(false);
    }
    if (name === "gameover") app._endBestBonus = opts.endBestBonus ?? null;
    app.techTreeTab = opts.techTreeTab || "foundations";
    app.techSelectedId = opts.techSelectedId ?? null;
    app.status = opts.status ?? "";
    app.forgeSlot = opts.forgeSlot ?? 0;
    app.forgeReturn = opts.forgeReturn ?? "";
    app.prepLevelId = opts.prepLevelId ?? 1;
    app.prepSlot = opts.prepSlot ?? 0;
    app.upgradeReturn = opts.upgradeReturn ?? "";
    const state = {
      meta: app.meta,
      sim: app.sim,
      firstClear: !!opts.firstClear,
      endBestBonus: opts.endBestBonus ?? null,
      status: app.status,
      forgeSlot: app.forgeSlot,
      forgeReturn: app.forgeReturn || "main",
      prepLevelId: app.prepLevelId,
      prepSlot: app.prepSlot,
      upgradeReturn: app.upgradeReturn,
      techTreeTab: app.techTreeTab,
      techSelectedId: app.techSelectedId,
      checkpoint: null,
    };
    const nextHtml = NEXT[name](state);
    const oracleHtml = app.ui.innerHTML;
    const nextBox = document.createElement("div");
    nextBox.innerHTML = nextHtml;
    if (name === "forge") {
      // Mirror the oracle's post-mount paintForgePreview resize (css 112, dpr 1)
      const cv = nextBox.querySelector("#forgePreview");
      if (cv) {
        cv.width = 112;
        cv.height = 112;
      }
    }
    const nextNorm = nextBox.innerHTML;
    return {
      oracle: oracleHtml,
      next: nextNorm,
      match: oracleHtml === nextNorm,
      screenHtml: app.ui.querySelector(".screen")?.outerHTML || "",
    };
  };

  /** First purchasable node id in a tree (for overlay tests). */
  function firstNodeId(treeId) {
    const tree = TECH_TREES.find((t) => t.id === treeId) || TECH_TREES[0];
    const walk = (node) => {
      if (!node) return null;
      if (node.kind !== "group" && node.kind !== "root") return node.id;
      for (const c of node.children || []) {
        const r = walk(c);
        if (r) return r;
      }
      return null;
    };
    return walk(tree);
  }
  W.__firstNodeId = firstNodeId;
</script></body></html>
