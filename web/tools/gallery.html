<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tower Gallery — part tour at every angle &amp; pitch</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #14181f;
      color: #e8e0d0;
      font-family: "Chakra Petch", system-ui, sans-serif;
    }
    h1 { font-size: 1.1rem; letter-spacing: 0.14em; text-transform: uppercase; color: #c9a227; }
    h2 { font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; color: #a89878; margin: 28px 0 8px; }
    .controls { display: flex; gap: 18px; align-items: center; margin: 12px 0 4px; }
    .controls label { font-size: 0.8rem; color: #a89878; }
    .controls input { width: 260px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
      gap: 10px;
    }
    .tile {
      background: #1b2029;
      border: 1px solid #3a4558;
      border-radius: 8px;
      padding: 6px;
      text-align: center;
    }
    .tile canvas { display: block; margin: 0 auto; }
    .tile figcaption {
      font-size: 0.62rem;
      color: #a89878;
      letter-spacing: 0.05em;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tile figcaption b { color: #e8e0d0; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Tower Gallery</h1>
  <div class="controls">
    <label>Pitch <span id="pitchVal">24°</span></label>
    <input id="pitch" type="range" min="8" max="58" step="1" value="24" />
    <button id="randomize">Random combo</button>
    <span id="randomLbl"></span>
  </div>
  <div id="randomRow" class="grid"></div>

  <h2>Self-check</h2>
  <div id="selfcheck" style="max-width:700px"></div>

  <h2>Bases × single × kinetic — angles 0° / up / 180° / down</h2>
  <div id="bases" class="grid"></div>

  <h2>Barrels on sentry × kinetic — 4 angles</h2>
  <div id="barrels" class="grid"></div>

  <h2>Payloads on sentry × single — 4 angles</h2>
  <div id="payloads" class="grid"></div>

  <h2>Enemies — silhouettes (frozen animation phase)</h2>
  <div id="enemies" class="grid"></div>

  <script type="module">
    import { PARTS } from "../js/data/parts.js";
    import { ENEMY_KINDS } from "../js/data/enemies.js";
    import { ProcPalette } from "../js/view/palette.js";
    import { renderTowerNext, hubLiftForNext, crownFactorForNext } from "../js/view/next/renderTower.js";
    import { renderEnemyNext } from "../js/view/next/renderEnemy.js";
    import { VIEW25, setPitch } from "../js/view/view25.js";

    const palette = new ProcPalette();
    const ANG = [0, -Math.PI / 2, Math.PI, Math.PI / 2];
    const ANG_LABEL = ["0°", "up", "180°", "down"];
    const SIZE = 200;
    const CSS = 92;

    function makeCanvas(alt) {
      const c = document.createElement("canvas");
      c.width = SIZE;
      c.height = SIZE;
      c.alt = alt;
      return c;
    }

    function draw(canvas, t) {
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, SIZE, SIZE);
      renderTowerNext(ctx, palette, t, (SIZE - CSS) / 2, (SIZE - CSS) / 2 + 6, CSS, {
        showBadge: false,
      });
    }

    function tile(canvas, caption, angle, pitch) {
      const el = document.createElement("div");
      el.className = "tile";
      const fig = document.createElement("figcaption");
      fig.innerHTML = caption;
      fig.title = `${caption} · ${ANG_LABEL[ANG.indexOf(angle)]} · ${Math.round(pitch)}°`;
      el.appendChild(canvas);
      el.appendChild(fig);
      return el;
    }

    function renderRow(container, specs) {
      container.innerHTML = "";
      for (const s of specs) {
        const cv = makeCanvas(s.alt);
        draw(cv, s.t);
        container.appendChild(tile(cv, s.label, s.angle, s.pitch));
      }
    }

    const bases = Object.keys(PARTS.bases);
    const barrels = Object.keys(PARTS.barrels);
    const payloads = Object.keys(PARTS.payloads);
    const enemies = Object.keys(ENEMY_KINDS);

    // ——— self-check: pixel + geometry invariants over every tile ———
    const checkLog = [];
    const check = (ok, name, detail = "") => {
      checkLog.push({ ok, name, detail });
    };

    function bboxOf(canvas) {
      const d = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height).data;
      let minX = 1e9, minY = 1e9, maxX = -1, maxY = -1, painted = 0;
      for (let y = 0; y < canvas.height; y++) for (let x = 0; x < canvas.width; x++) {
        if (d[(y * canvas.width + x) * 4 + 3] > 8) {
          painted++;
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
      return painted ? { minX, minY, maxX, maxY, painted } : null;
    }

    function runSelfCheck() {
      checkLog.length = 0;
      const all = [...document.querySelectorAll("canvas")];
      const W = all[0]?.width || 0;
      // 1. every tile paints, nothing clips the canvas
      let empty = 0, clipped = 0;
      for (const c of all) {
        const b = bboxOf(c);
        if (!b) { empty++; continue; }
        if (b.minX < 2 || b.minY < 2 || b.maxX > W - 3 || b.maxY > W - 3) clipped++;
      }
      check(empty === 0, "every part paints", `${empty} empty tile(s)`);
      check(clipped === 0, "no tile clips the canvas", `${clipped} clipped`);

      // 2. hub always clears the base crown (the BASE_CROWN invariant)
      for (const base of bases) {
        const lift = hubLiftForNext(92, base);
        const crown = 92 * 1.22 * crownFactorForNext(base) * VIEW25.vExag;
        check(lift >= crown, `hub clears crown — ${base}`, `lift ${lift.toFixed(1)} vs crown ${crown.toFixed(1)}`);
      }

      // 3. barrels foreshorten along depth at high pitch (up < side, turret zone)
      awaitPitch(58).then(() => { /* measured below in second pass */ });
    }

    async function awaitPitch(v) {
      const el = document.getElementById("pitch");
      el.value = String(v);
      el.dispatchEvent(new Event("input"));
      await new Promise((r) => setTimeout(r, 50));
    }

    async function runSelfCheckAll() {
      // render at default pitch first
      await awaitPitch(24);
      runSelfCheck();
      // turret-zone foreshorten at 58: an up-aiming barrel REcedes — its
      // zone's height (depth length) must be shorter than when side-aiming.
      // (Zone width is wrong for pods whose tubes spread across the aim.)
      const nBase = bases.length * 4;
      // Zone extents (width AND height) at both pitches. The zone is the top
      // 45% of each tower — where the turret lives.
      const ext = (c) => {
        const b = bboxOf(c);
        if (!b) return { w: 0, h: 0 };
        const zoneBottom = b.minY + Math.round((b.maxY - b.minY) * 0.45);
        let zMinX = 1e9, zMaxX = -1, zMinY = 1e9, zMaxY = -1;
        const d = c.getContext("2d").getImageData(0, 0, c.width, c.height).data;
        for (let y = b.minY; y <= zoneBottom; y++) for (let x = b.minX; x <= b.maxX; x++) {
          if (d[(y * c.width + x) * 4 + 3] > 8) {
            if (x < zMinX) zMinX = x; if (x > zMaxX) zMaxX = x;
            if (y < zMinY) zMinY = y; if (y > zMaxY) zMaxY = y;
          }
        }
        return { w: zMaxX > zMinX ? zMaxX - zMinX + 1 : 0, h: zMaxY > zMinY ? zMaxY - zMinY + 1 : 0 };
      };
      const zone = () => [...document.querySelectorAll("canvas")].map(ext);
      await awaitPitch(58);
      const z58 = zone();
      await awaitPitch(24);
      const z24 = zone();
      // Whole-bbox widths are pitch-stable (footprints keep their x-radius),
      // so a side barrel's LENGTH can be read from the full-tower bbox width.
      const fullW = () => [...document.querySelectorAll("canvas")].map((c) => {
        const b = bboxOf(c);
        return b ? b.maxX - b.minX + 1 : 0;
      });
      await awaitPitch(58);
      const w58 = fullW();
      await awaitPitch(24);
      const w24 = fullW();
      let badRecede = 0, badSideLen = 0, badSideThin = 0, avgRecede = 0;
      for (let i = 0; i < barrels.length; i++) {
        // Away-facing (angle up): zone HEIGHT = foreshortened length — recedes
        const up58 = z58[nBase + i * 4 + 1].h;
        const up24 = z24[nBase + i * 4 + 1].h;
        if (up58 >= up24) badRecede++;
        else avgRecede += up24 - up58;
        // Side-facing: full width (dominated by base pad + barrel length) stable
        if (Math.abs(w58[nBase + i * 4] - w24[nBase + i * 4]) > Math.max(6, w24[nBase + i * 4] * 0.12)) badSideLen++;
        // ...and the turret zone never significantly thins as pitch rises
        // (V lock — the old cos-scale bug thinned side barrels by ~45%)
        const h58 = z58[nBase + i * 4].h;
        const h24 = z24[nBase + i * 4].h;
        if (h58 < h24 * 0.8) badSideThin++;
      }
      check(badRecede === 0, "away barrels recede as pitch rises", `${badRecede} not receding (avg ${(avgRecede / Math.max(1, barrels.length - badRecede)).toFixed(1)}px)`);
      check(badSideLen === 0, "side barrels keep their length", `${badSideLen} drifted`);
      check(badSideThin === 0, "side barrels never thin with pitch (V lock)", `${badSideThin} thinned`);
      // Head-on tubes must read as receding end-on cylinders: the muzzle cap
      // converges well inside the hub width at the default pitch.
      await awaitPitch(24);
      let badCap = 0;
      for (let i = 0; i < barrels.length; i++) {
        const c = document.querySelectorAll("canvas")[nBase + i * 4 + 1];
        const b = bboxOf(c);
        if (!b) continue;
        const d = c.getContext("2d").getImageData(0, 0, c.width, c.height).data;
        const w = (y0, y1) => {
          let mn = 1e9, mx = -1;
          for (let y = y0; y <= y1; y++) for (let x = b.minX; x <= b.maxX; x++) {
            if (d[(y * c.width + x) * 4 + 3] > 8) { if (x < mn) mn = x; if (x > mx) mx = x; }
          }
          return mx > mn ? mx - mn + 1 : 0;
        };
        const muzzle = w(b.minY, b.minY + Math.round((b.maxY - b.minY) * 0.3));
        const hub = w(b.minY + Math.round((b.maxY - b.minY) * 0.7), b.maxY);
        if (muzzle >= hub) badCap++;
      }
      check(badCap === 0, "head-on barrels read as receding end-on cylinders", `${badCap} flat-looking`);
      // unknown/future parts must fall back gracefully (palette + painter defaults)
      const scratch = makeCanvas("future_part");
      let threw = false;
      try {
        draw(scratch, { base: "future_base", barrel: "future_barrel", payload: "future_payload", aimAngle: 0, level: 1 });
      } catch (e) {
        threw = true;
      }
      const b = bboxOf(scratch);
      check(!threw && !!b, "unknown parts fall back to defaults", threw ? "threw" : b ? `paints ${b.painted}px` : "empty");
      await awaitPitch(24);
      renderCheckPanel();
    }

    function renderCheckPanel() {
      const panel = document.getElementById("selfcheck");
      const fails = checkLog.filter((c) => !c.ok);
      panel.innerHTML =
        `<div style="margin:6px 0;color:${fails.length ? "#e06a5a" : "#7ec8a0"};font-weight:700">` +
        `SELF-CHECK: ${fails.length ? fails.length + " FAIL" : "PASS"} (${checkLog.length} checks)` +
        `</div>` +
        checkLog
          .map((c) => `<div style="color:${c.ok ? "#9aa8b8" : "#e06a5a"};font-size:0.7rem">${c.ok ? "✓" : "✗"} ${c.name} ${c.detail}</div>`)
          .join("");
      window.__galleryCheck = { pass: fails.length === 0, checks: checkLog.length };
    }

    function renderAll() {
      const pitch = +document.getElementById("pitch").value;
      document.getElementById("pitchVal").textContent = `${pitch}°`;
      setPitch(pitch);

      const baseSpecs = [];
      for (const base of bases) {
        for (const a of ANG) {
          baseSpecs.push({
            label: `<b>${base}</b>`,
            angle: a,
            pitch,
            t: { base, barrel: "single", payload: "kinetic", aimAngle: a, level: 1 },
          });
        }
      }
      renderRow(document.getElementById("bases"), baseSpecs);

      const barrelSpecs = [];
      for (const barrel of barrels) {
        for (const a of ANG) {
          barrelSpecs.push({
            label: `<b>${barrel}</b>`,
            angle: a,
            pitch,
            t: { base: "sentry", barrel, payload: "kinetic", aimAngle: a, level: 1 },
          });
        }
      }
      renderRow(document.getElementById("barrels"), barrelSpecs);

      const payloadSpecs = [];
      for (const payload of payloads) {
        for (const a of ANG) {
          payloadSpecs.push({
            label: `<b>${payload}</b>`,
            angle: a,
            pitch,
            t: { base: "sentry", barrel: "single", payload, aimAngle: a, level: 1 },
          });
        }
      }
      renderRow(document.getElementById("payloads"), payloadSpecs);

      const enemySpecs = enemies.map((kind) => ({
        label: `<b>${kind}</b>`,
        angle: 0,
        pitch,
        draw: (cv) => {
          const ctx = cv.getContext("2d");
          ctx.clearRect(0, 0, SIZE, SIZE);
          renderEnemyNext(ctx, palette, kind, SIZE / 2, (SIZE - CSS) / 2 + 6 + CSS / 2, CSS, {
            t: 1,
            phase: 0,
          });
        },
      }));
      const enemyRow = document.getElementById("enemies");
      enemyRow.innerHTML = "";
      for (const spec of enemySpecs) {
        const cv = makeCanvas(kindLabel(spec.label));
        spec.draw(cv);
        enemyRow.appendChild(tile(cv, spec.label, 0, pitch));
      }
    }
    function kindLabel(html) {
      return html.replace(/<[^>]*>/g, "");
    }

    document.getElementById("pitch").addEventListener("input", renderAll);

    document.getElementById("randomize").addEventListener("click", () => {
      const base = bases[(Math.random() * bases.length) | 0];
      const barrel = barrels[(Math.random() * barrels.length) | 0];
      const payload = payloads[(Math.random() * payloads.length) | 0];
      const specs = ANG.map((a) => ({
        label: `<b>${base}</b> · ${barrel} · ${payload}`,
        angle: a,
        pitch: +document.getElementById("pitch").value,
        t: { base, barrel, payload, aimAngle: a, level: 3 },
      }));
      renderRow(document.getElementById("randomRow"), specs);
      document.getElementById("randomLbl").textContent = `${base} / ${barrel} / ${payload}`;
    });

    renderAll();
    runSelfCheckAll();
  </script>
</body>
</html>
